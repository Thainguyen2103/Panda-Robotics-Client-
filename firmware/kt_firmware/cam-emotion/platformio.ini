; cam-emotion — camera + màn TFT + AI nhận diện cảm xúc (code của Thái, chạy trên laptop).
; Nạp xong: đóng Serial Monitor, bấm đúp chay-cam-xuc.bat.
[env:esp32-s3-head]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 4000000

board_build.flash_size = 16MB
board_build.psram_type = opi
; N16R8 = flash QIO + PSRAM OPI. Thiếu dòng này firmware coi như board không có PSRAM
; → camera không có chỗ chứa ảnh 640x480 (xem cam-selftest).
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.9
