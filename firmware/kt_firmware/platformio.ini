[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    ; Mic I2S (INMP441): Wokwi chua mo phong duoc nen luon doc ra 0 byte, trong khi
    ; I2S.begin() chiem ~30KB RAM (task nen 20KB + ring buffer + DMA buffer).
    ; Doi thanh 1 khi chay tren board that co mic (du kien Tuan 9).
    -D ENABLE_I2S_MIC=0

    ; WiFi + MQTT: dang TAT de test phan hien thi tu vung cho nhe (21/09/2026).
    ; Khi tat, toan bo network.cpp (ke ca #include <WiFi.h>) khong duoc bien dich:
    ; khoi dong tuc thi thay vi cho WiFi 15s, khong con retry moi 5s lam giat animation.
    ; DOI THANH 1 de bat lai MQTT khi ghep voi server/dashboard that — khong can sua
    ; main.cpp dong nao, cac ham networkSetup/Loop/Publish tu chay lai binh thuong.
    -D ENABLE_MQTT=0

    ; Mo khoa cac font lon cua u8g2 (font Nhat nam sau #ifdef nay trong u8g2_fonts.c).
    ; Thieu co nay se loi link "undefined reference to u8g2_font_b16_t_japanese2".
    ; Linker tu loai cac font khong dung (moi font nam trong 1 section rieng) nen chi
    ; font thuc su duoc tham chieu trong display.cpp moi ton flash.
    -D U8G2_USE_LARGE_FONTS

lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit ILI9341 @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.9
    ; Cau noi giup ve font cua u8g2 (co Kana/Kanji) len bat ky doi tuong Adafruit_GFX nao
    ; — dung duoc voi ca `tft` lan GFXcanvas. Adafruit_GFX khong co san glyph tieng Nhat.
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
