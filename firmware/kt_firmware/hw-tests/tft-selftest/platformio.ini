; tft-selftest — test RIÊNG màn hình TFT ILI9341, không đụng camera/mic/loa.
[env:esp32-s3-head]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM
    ; Mo khoa font lon cua u8g2 (font Nhat nam sau #ifdef nay trong u8g2_fonts.c) — thieu
    ; co nay se loi link "undefined reference to u8g2_font_b16_t_japanese2".
    -D U8G2_USE_LARGE_FONTS

lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.9
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
