; speaker-only — test RIÊNG khuếch đại MAX98357 + loa, KHÔNG dùng mic.
; Board tự tạo âm thanh chuẩn (sóng sin sạch) → nếu vẫn rè thì lỗi ở loa/khuếch đại/nguồn.
[env:esp32-s3-head]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM
