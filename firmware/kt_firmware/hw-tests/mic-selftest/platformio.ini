; mic-selftest — test RIÊNG mic, phát tiếng nói qua loa MÁY TÍNH (không cần khuếch đại +
; loa vật lý đã lắp vào board — hữu ích khi mic lắp trước, amp lắp sau).
[env:esp32-s3-head]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM
