; head-hw-test — firmware TEST PHẦN CỨNG cho board HEAD thật (KHÔNG phải Wokwi).
;
; Đây là project PlatformIO riêng, tách khỏi firmware-demo/ (project đó chạy trên ESP32
; thường trong Wokwi cho phần mắt/màn hình). Board HEAD dùng chip khác (ESP32-S3-N16R8,
; có PSRAM 8MB + flash 16MB) nên cần cấu hình board riêng — nạp nhầm cấu hình cũ dễ bị lỗi
; "flash size mismatch" hoặc treo máy khi khởi động do đọc sai vùng nhớ PSRAM.
[env:esp32-s3-head]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Bản N16R8: 16MB flash + 8MB PSRAM kiểu Octal (OPI) — khai rõ ra để trình biên dịch dùng
; đúng driver PSRAM, nếu để mặc định (thường là 4MB/QSPI) máy sẽ boot lỗi ngay khi PSRAM
; được đụng tới (ví dụ lúc cấp bộ đệm DMA cho I2S).
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM
