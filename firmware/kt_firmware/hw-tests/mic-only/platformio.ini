; mic-only — test RIÊNG mic INMP441, KHÔNG dùng loa robot.
; Âm thanh gửi qua dây USB lên laptop, nghe bằng loa/tai nghe laptop (chạy ghi-am-mic.bat).
; Loa laptop chắc chắn tốt → nếu bản ghi rè thì lỗi nằm ở mic (hoặc dây mic), không phải loa robot.
[env:esp32-s3-head]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; 921600 baud ≈ 92KB/giây, dư cho âm 16kHz × 2 byte = 32KB/giây. Phải khớp SERIAL_BAUD trong main.cpp.
monitor_speed = 921600

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM
