; cam-selftest — test RIÊNG camera, gửi video qua dây USB lên laptop (xem bằng xem-camera.bat).
; monitor_speed phải khớp SERIAL_BAUD trong main.cpp. Serial Monitor sẽ thấy ký tự rác xen
; giữa log vì đó là dữ liệu ảnh — dùng xem-camera.bat thay cho Serial Monitor.
[env:esp32-s3-head]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 4000000

board_build.flash_size = 16MB
board_build.psram_type = opi
; N16R8 = flash chạy kiểu QIO + PSRAM chạy kiểu OPI (8 dây). Thiếu dòng này PlatformIO dựng
; firmware cho board KHÔNG có PSRAM → psramFound() = false → camera tụt về 320x240, 1 bộ đệm.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM
