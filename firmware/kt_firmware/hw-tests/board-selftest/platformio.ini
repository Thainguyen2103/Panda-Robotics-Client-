; board-selftest — bài test NHỎ NHẤT có thể: không đụng tới mic/loa/camera, chỉ để trả lời
; đúng 1 câu hỏi "board ESP32-S3 này có nạp được và chạy code không". Không nối dây gì cả,
; chỉ cần cáp USB-C từ board sang máy tính.
[env:esp32-s3-head]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM
