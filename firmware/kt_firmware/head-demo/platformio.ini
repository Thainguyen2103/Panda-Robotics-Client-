; head-d        emo — camera + màn TFT + loa: AI cảm xúc của Thái + trò chuyện (STT/LLM/TTS của Thái, Ngọc Anh).
; Nạp xong: đóng Serial Monitor, bấm đúp chay-demo.bat.
[platformio]
; Nút Upload của VS Code chỉ nạp qua DÂY. Nạp qua WiFi dùng env "ota" bên dưới.
default_envs = esp32-s3-head

[env:esp32-s3-head]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 4000000

board_build.flash_size = 16MB
board_build.psram_type = opi
; N16R8 = flash QIO + PSRAM OPI. Thiếu dòng này firmware coi như board không có PSRAM
; → camera không có chỗ chứa ảnh 640x480 (xem cam-selftest).
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.9

; Nạp code QUA WIFI, không cần dây. Điều kiện: board đã chạy bản firmware có WiFi này
; (nạp bằng dây 1 lần đầu), board + laptop cùng vào hotspot. Lệnh (trong thư mục head-demo):
;   pio run -e ota -t upload
; Lần đầu Windows hỏi tường lửa cho python → bấm Allow (board phải gọi ngược về laptop để lấy code).
; Báo không tìm thấy "panda-head.local" → thay dòng upload_port bằng IP board
; (chay-demo.bat in ra dòng "[WIFI] tim thay board dau: 192.168.137.xx").
[env:ota]
extends = env:esp32-s3-head
upload_protocol = espota
upload_port = panda-head.local
