; body-test — thử phần THÂN: 2 bánh (TB6612) + cảm biến vật cản HC-SR04.
; Nạp xong: đóng Serial Monitor, bấm đúp chay-test.bat rồi giữ phím L / R.
[platformio]
; Nút Upload của VS Code chỉ nạp qua DÂY. Nạp qua WiFi dùng env "ota" bên dưới.
default_envs = esp32-body

[env:esp32-body]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Nạp code QUA WIFI, không cần dây. Điều kiện: board đã chạy bản firmware có OTA này
; (nạp bằng dây 1 lần đầu), board + laptop cùng vào hotspot. Lệnh (trong thư mục body-test):
;   pio run -e ota -t upload
; Lần đầu Windows hỏi tường lửa cho python → bấm Allow.
; Báo không tìm thấy "panda-body.local" → thay dòng upload_port bằng IP board
; (xem trong Mobile hotspot của Windows, hoặc dòng "[THAN] tim thay board than qua WiFi: ...").
[env:ota]
extends = env:esp32-body
upload_protocol = espota
upload_port = panda-body.local
